[package]
name = "housefire-render"
version = "0.1.0"
edition = "2024"
description = "House Fire's own Vulkan renderer: draws a frame's records offscreen"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
housefire = { path = ".." }
ash = "0.38"
png = "0.17"
# the play binary: the gamepad
gilrs = "0.11"
# the sound device (ALSA, which PipeWire and Pulse both serve)
cpal = { version = "=0.15.3", default-features = false }
# the window (the `view` binary): Wayland and X11, no input extras
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06", "x11", "wayland"] }

# Its own target directory and lock file: the simulation crate (`..`) has no GPU dependency.
[workspace]

[profile.release]
debug = "line-tables-only"
